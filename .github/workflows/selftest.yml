# The plugin's own gate on Linux. Runs the selftest only — install.sh is not
# exercised here (docs/GETTING-STARTED.md §Platforms).
name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: selftest
        run: bash tests/selftest.sh
